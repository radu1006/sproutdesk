<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SproutDesk</title>
    <meta
      name="description"
      content="SproutDesk - early learning centre management: attendance, daily reports, class feed, announcements, events, observations, billing and family messaging."
    />
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f7d5c'/%3E%3Cpath d='M16 24c-4 0-7-2.6-7-6 0-3 2.2-5 4.5-6.2C15.9 10.2 16 8.4 16 7c0 0 3.4 2.6 3.4 6.6C22 15 23 17 23 18.6 23 21.6 20 24 16 24Z' fill='%23c7ecc9'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="boot" class="boot">
      <div class="boot-mark">SproutDesk</div>
      <p class="muted">Starting up…</p>
    </div>

    <div id="login-screen" class="login-screen" hidden></div>

    <div id="shell" class="shell" hidden>
      <aside id="sidebar" class="sidebar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">SD</span>
          <span class="brand-text">
            <strong id="brand-name">SproutDesk</strong>
            <small id="brand-tagline" class="muted"></small>
          </span>
        </div>
        <nav id="nav" class="nav" aria-label="Main navigation"></nav>
        <div class="sidebar-footer">
          <p class="muted small" id="engine-note"></p>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <button id="menu-toggle" class="icon-button" type="button" aria-label="Toggle navigation">
            ☰
          </button>
          <div class="topbar-title">
            <h1 id="page-title">Dashboard</h1>
            <p id="page-subtitle" class="muted small"></p>
          </div>
          <div id="topbar-actions" class="topbar-actions"></div>
        </header>
        <section id="view" class="view" aria-live="polite"></section>
      </main>
    </div>

    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
    <div id="modal-root"></div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
